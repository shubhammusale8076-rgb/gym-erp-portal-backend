# Integration Service Configuration
integration.service.timeout=5000
integration.service.retry.max-attempts=3
integration.service.retry.delay=1000

# Resilience4j Configuration
resilience4j.circuitbreaker.instances.integrationService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.integrationService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.integrationService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.integrationService.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.integrationService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.integrationService.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.integrationService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.integrationService.eventConsumerBufferSize=10

resilience4j.retry.instances.integrationService.maxAttempts=3
resilience4j.retry.instances.integrationService.waitDuration=2s
resilience4j.retry.instances.integrationService.enableExponentialBackoff=true
resilience4j.retry.instances.integrationService.exponentialBackoffMultiplier=2

# Feign Configuration
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=5000
feign.circuitbreaker.enabled=true

# CRM Automation Configuration
crm.automation.max-retries=5
crm.automation.outbox.batch-size=50
crm.automation.outbox.process-interval-ms=5000

